# Phase 1 Step 12. Ruff, mypy, and pytest all run via `uv run --directory
# backend <tool>` local hooks rather than the ruff-pre-commit / mirrors-mypy
# mirrors — that way the exact versions and type stubs pre-commit sees are
# always the ones pinned in backend/pyproject.toml + backend/uv.lock, never
# a second, independently-drifting pin. gitleaks (a Go binary, not a Python
# dependency) is the one hook that genuinely needs its own mirror repo.
#
# Run `uv run --directory backend pre-commit install` once per clone to
# register these hooks. See backend/README.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1000"] # uv.lock alone is ~580KB
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # `--project backend` (not `--directory backend`): pre-commit passes
      # repo-root-relative filenames as extra args to these two hooks, and
      # `--directory` would `cd` into backend/ before ruff ever sees them,
      # breaking every path. `--project` only picks backend's venv/pyproject
      # without touching cwd, so the root-relative paths resolve correctly.
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend ruff check --fix
        language: system
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format
        language: system
        files: ^backend/.*\.py$

      - id: mypy
        name: mypy --strict (backend/src/ankura)
        entry: uv run --directory backend mypy src/ankura
        language: system
        files: ^backend/src/ankura/.*\.py$
        pass_filenames: false
