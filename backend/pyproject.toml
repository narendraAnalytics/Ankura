[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "firebase-admin>=7.5.0",
    "google-auth>=2.56.3",
    "google-cloud-aiplatform>=1.164.0",
    "google-cloud-core>=2.6.1",
    "google-cloud-logging>=3.16.2",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.13.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.3",
    "langgraph>=1.2.11",
    "psycopg[binary,pool]>=3.3.4",
    "pwdlib>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.1.5",
    "ruff>=0.16.2",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Header() in argument defaults is the
# framework's own idiom, not the mutable-default-argument bug B008 exists
# to catch — FastAPI evaluates these once at route-registration time, not
# per-call.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
explicit_package_bases = true
